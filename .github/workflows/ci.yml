# Minimal CI: the gates that can run green today.
#
# THIS IS NOT THE FULL GATE SET. ARCHITECTURE-SPINE.md AD-19 requires CI to block
# merge on: dependency-cruiser, the ESLint clock/env rules, the cross-tenant harness
# (AD-3), the append-only DB test (AD-5), the FORCE-RLS assertion (AD-3), the golden
# Published Snapshot recompute per formulaVersion (AD-10), the compaction-then-recompute
# test (AD-5), the ComputationInputs closure test (AD-10), the concurrency test (AD-20),
# and the six scheduler gates (AD-26/27/28).
#
# The ESLint clock/env rules are now here — story 1.1 slice B1 added them. Every other
# entry still needs code that does not exist yet, and most need a Postgres service. They
# belong to Epic 1 story 1.2 (the registry, RLS and the rewiring the dependency-cruiser
# gate waits on) and Epic 2 story 2.1 (the migration). Adding them before their code
# exists would make CI red on day one for a reason nobody could fix that day — which is
# the failure epics.md warns about for the dependency-cruiser gate specifically.
#
# So this file gates on what is real: lint, all three typechecks and the test suite.
# Measured on 2026-09-20 — `pnpm lint` exits 0, all three typechecks exit 0, and
# `pnpm test` passes 72 tests across 7 files against the prepared Postgres service below
# (53 across 4 before story 1.1 slice B2; that slice added apps/worker/src/worker-round-trip.test.ts,
# scripts/pgboss-migrate.test.ts and packages/app/src/config.test.ts).
#
# Every gate here has been watched to fail, because a gate nobody has seen fail is
# indistinguishable from a green light:
#   * typecheck — injecting `const x: number = "str"` into packages/domain/src/units.ts
#     fails with TS2322 (verified in slice A).
#   * lint — eleven injected violations each fail with the rule named, and each returns the
#     gate to 0 when removed: `Date.now()`, `new Date()`, `Date()`, `process.env.FOO`,
#     `const { env } = process` and `const p = process; p.env.FOO` in a source file; the
#     first two forms inside each sanctioned home, which is exempt from one ban and not the
#     other; `Date.now()` in a test file; a `.mjs` module under packages/; and a stale
#     eslint-disable directive, which `--max-warnings 0` turns into a failure. The full
#     table is in spec-1-1-workspace-skeleton.md.
#   * typecheck (apps/worker) — `const __bad: number = 'nope'` in apps/worker/src/index.ts
#     is caught by this step and by neither of the other two, because the root tsconfig
#     excludes `apps`.
#   * tests (the role split) — each assertion was watched to fail by breaking the thing it
#     covers: pointing the entry point at DATABASE_URL, flipping `migrate` to true, granting
#     the app role CREATE on `pgboss`, granting it BYPASSRLS, deleting the migrator's
#     percent-decoding, relaxing APP_DATABASE_URL to a zod `.default()` (which still
#     typechecks), and removing APP_DATABASE_URL under REQUIRE_DB=1. The full table is in
#     spec-1-1-pgboss-roles.md.

# THESE GATES REPORT; THEY DO NOT BLOCK. The repository is private on a free plan, so
# GitHub refuses branch protection ("Upgrade to GitHub Pro or make this repository
# public"). Founder decision, 2026-09-20: stay private and keep the discipline in the
# person rather than the platform — the alternatives were paying for Pro, or going
# public with planning artifacts that carry a real client's name and contract type.
# Revisit when a second person can merge.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + 3 typechecks + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The image is pinned to the same tag infra/docker-compose.yml uses, so CI and a
    # laptop exercise the same server. The round-trip test is the only gate covering
    # the ORM, the driver and the server together; everything else here is static.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: momo
          POSTGRES_PASSWORD: momo
          POSTGRES_DB: momo_keikaku
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U momo -d momo_keikaku"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://momo:momo@localhost:55433/momo_keikaku
      # The restricted `app` role, created by the prepare step below from this very string:
      # `pnpm pgboss:migrate` reads the role name and password out of it, so the role the
      # worker connects as and the role the migrator creates cannot disagree. It is NOT a
      # second name for DATABASE_URL — it holds DML on the `pgboss` schema and nothing
      # else, and has no grant on any application table until story 1.2's table-class
      # registry generates them.
      APP_DATABASE_URL: postgres://momo_app:momo_app@localhost:55433/momo_keikaku
      # Turns an unreachable database into a failure instead of a skip. Without it the
      # round-trip tests would pass by not running, which is the same as not having them.
      REQUIRE_DB: '1'

    steps:
      - uses: actions/checkout@v4

      # ARCHITECTURE-SPINE.md pins Node.js 24.21.0 (LTS "Krypton"), and this is the exact
      # version, not a floating major: two runs of the same commit resolve the same Node.
      # Reads `.nvmrc`, so CI and a laptop running `nvm use` can never name different
      # Node versions. The value there is the architecture's decided 24.21.0.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # corepack reads `packageManager` from package.json, so the pnpm version is never
      # duplicated here. It is 12.4.2, the version the spine decided. Bumping it needs no
      # edit to this file, but it is NOT a one-file change: pnpm pins itself in the
      # lockfile (`packageManagerDependencies` plus 42 `@pnpm/exe.*` entries), so
      # `packageManager` and `pnpm-lock.yaml` must move together or the frozen install
      # below fails before any gate runs.
      - name: Enable corepack (honours packageManager)
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Three typecheck steps, because the root tsconfig excludes `apps` — so each app
      # needs its own or a type error there reaches main unnoticed. Next.js only catches
      # apps/web's at `next build`, which CI does not run, and nothing at all would catch
      # apps/worker's. All three are plain `tsc --noEmit`, so none emits into the source
      # tree.
      - name: Typecheck (packages, scripts)
        run: pnpm typecheck

      - name: Typecheck (apps/web)
        if: always()
        run: pnpm --filter @momo/web typecheck

      - name: Typecheck (apps/worker)
        if: always()
        run: pnpm --filter @momo/worker typecheck

      # The clock and environment fence (see eslint.config.js). It is ESLint rather than
      # dependency-cruiser because dependency-cruiser sees imports and this class of
      # violation is a call, not an import. An ungated rule enforces nothing, which is
      # why this step exists the same day the rules do.
      - name: Lint (clock/env fence)
        if: always()
        run: pnpm lint

      # The round-trip tests need something to read. `push` applies schema.ts through
      # drizzle-kit rather than a migration, which is correct while Epic 2's single
      # pre-production migration does not exist yet; switch this to `drizzle-kit
      # migrate` when it does.
      #
      # `pgboss:migrate` is the owner-role step: it creates the `migrator` and `app` roles,
      # installs pg-boss's schema from the SQL pg-boss itself generates, and grants the app
      # role USAGE plus DML and nothing else. It runs here rather than inside the worker
      # because the worker's whole point is that it *cannot* do this.
      #
      # It runs TWICE on purpose. Idempotence is an acceptance criterion of story 1.1 slice
      # B2, and a criterion checked by hand once is not a gate: the second run is what fails
      # the build the day a non-idempotent statement is added to that script.
      - name: Prepare database (schema + seed + pgboss roles/schema)
        if: always()
        run: |
          pnpm exec drizzle-kit push --force
          pnpm seed
          pnpm pgboss:migrate
          pnpm pgboss:migrate

      # `always()` throughout so one failure does not hide the others. Every signal
      # lands on the same run.
      - name: Tests
        if: always()
        run: pnpm test
