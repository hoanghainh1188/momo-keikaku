# Minimal CI: the gates that can run green today.
#
# THIS IS NOT THE FULL GATE SET. ARCHITECTURE-SPINE.md AD-19 requires CI to block
# merge on: dependency-cruiser, the ESLint clock/env rules, the cross-tenant harness
# (AD-3), the append-only DB test (AD-5), the FORCE-RLS assertion (AD-3), the golden
# Published Snapshot recompute per formulaVersion (AD-10), the compaction-then-recompute
# test (AD-5), the ComputationInputs closure test (AD-10), the concurrency test (AD-20),
# and the six scheduler gates (AD-26/27/28).
#
# The ESLint clock/env rules are now here — story 1.1 slice B1 added them. Story 1.2
# slice 1 added four more, all carried by `pnpm test` against the prepared service below:
#
#   * the unregistered-table assertion (packages/db/src/rls.test.ts) — every table in the
#     `public` schema is classed in packages/db/src/table-classes.ts, and the failure names
#     the table;
#   * the FORCE-RLS assertion (same file) — read from `pg_class.relrowsecurity`,
#     `pg_class.relforcerowsecurity` and `pg_policies`, never assumed;
#   * the tenant-isolation sabotages (same file) — a read with no tenant returns nothing,
#     and a read inside tenant A does not see tenant B, as the RESTRICTED application role,
#     because FORCE does nothing against a superuser;
#   * the append-only DB test (same file) — the missing grant refuses with 42501, the
#     trigger refuses the maintenance role with MOMO1 until `app.maintenance` is set.
#
# STORY 1.2 SLICE 2 ADDS THE CROSS-TENANT HARNESS (AD-3), AND NFR-S1 IS DISCHARGED.
# `tests/cross-tenant.test.ts` (moved from `packages/db/src/` by story 1.2 slice 3, when the
# read surface became `packages/app`'s use cases) seeds two probe Tenants — each a
# bijectively relabelled copy of the demo dataset — and drives EVERY read use case against
# both as the restricted role. Five gates come with it:
#
#   * the mechanical coverage gate — the covered set is read off the read surface's module
#     namespace (packages/app/src/use-cases, registry in tests/read-use-cases.ts), so an
#     exported read use case with no registry entry fails NAMING IT. This half needs no
#     database and runs on every machine;
#   * the generic isolation scan — the whole result graph, `Map` keys and values included,
#     is walked for the other Tenant's token and for the demo Tenant's markers. No
#     per-field allow-list, so a new use case's new fields are covered the day they are
#     written;
#   * three completeness assertions, so "returned nothing" cannot pass: the two probes'
#     results are identical after token substitution, every fixture value the registry says
#     a use case must surface comes back, and every NUMBER matches the demo Tenant's;
#   * the reach measurement — the tenant-owned tables no read use case touches are declared
#     in the registry and compared against what a Drizzle query logger measures. 14 of the
#     16 tenant-owned tables are reached; `program` and `audit_log` are declared, with
#     reasons, and either direction of change fails the build (story 1.4 slice 1 removed
#     `app_user`; the identity tables and the membership bridge are `global`);
#   * table-level isolation over that MEASURED set — for every table a use case was seen
#     reading, the restricted role inside `withTenant` must see no row belonging to anybody
#     else. This one was added after a sabotage: `USING (true)` on `baseline_wp` or
#     `rate_entry` leaked every Tenant's rows into the process and the four gates above
#     stayed green, because the read surface re-filters those two in memory by a key that
#     differs per Tenant. The rows had crossed the boundary even though the result looked
#     clean, and the acceptance criterion is about this file, not about rls.test.ts.
#
# STORY 1.2 SLICE 3 moved the seven read call sites in apps/web onto `packages/app` use
# cases, wired in one named composition root (apps/web/src/server/composition.ts). The
# harness now drives the use cases rather than the repository, so a use case that answers a
# foreign Project id with anything but `not_found`, or swallows the repository's failure and
# returns a default, fails it. `packages/app/src/use-cases/project-reads.test.ts` pins the
# `Result` contract with no database.
#
# STORY 1.2 SLICE 4 moved actions.ts's five write actions onto `packages/app` use cases and
# SWITCHED DEPENDENCY-CRUISER ON, in that order. `pnpm depcruise` (.dependency-cruiser.cjs,
# no database) fails on any `apps/*` import of `packages/db` or `drizzle-orm` outside the named
# carve-outs — `apps/web/src/server/composition.ts` and `packages/db/auth`, plus
# `apps/worker/src/index.ts` for `packages/adapters` only (AD-1 carve-out 3, ratified
# 2026-09-23) — and carries
# AD-1's two scheduling edges plus "the composition root never imports the schedule/plan-input
# repositories" as forward-looking rules. Scope is AC-6's, not all of AD-1: `apps/worker`'s
# `pg-boss`/`pg` imports stay out (recorded in deferred-work.md). The writes joined the
# harness too: `tests/cross-tenant-writes.test.ts` proves a foreign-Tenant write answers
# `not_found` and lands nothing in any tenant-owned table, and an own-Tenant write lands exactly
# the rows the action always wrote.
#
# Still absent: the golden Published Snapshot recompute per formulaVersion, the
# compaction-then-recompute test, the ComputationInputs closure test, the concurrency test and
# the six scheduler gates. Adding a gate before its code exists would make CI red on day one
# for a reason nobody could fix that day — which is why dependency-cruiser waited for the
# writes slice.
#
# So this file gates on what is real: lint, all three typechecks, dependency-cruiser and the
# test suite. Measured on 2026-09-22 — `pnpm lint`, all three typechecks and `pnpm depcruise`
# exit 0, and `pnpm test` passes 779 tests across 43 files against the prepared Postgres service
# below (545 of them, across 35 files, run with no database at all; 8 files skip themselves).
# The trail: 562 across 33 after story 1.4 slice 1, 165 across 14 before story 1.2 slice 4,
# 146 across 12 before slice 3, 123 across 11 before slice 2, 72 across 7 before slice 1,
# 53 across 4 before story 1.1 slice B2, 266 across 18 at the first measurement.
#
# KEEP THIS MEASURED, NOT ESTIMATED, AND WRAP IT LIKE ITS NEIGHBOURS. It went three slices stale
# — it read "562 across 33 (story 1.4 slice 1)" on a branch that had already landed slices 2, 3
# and 4, on a single ~140-column line inside a block wrapped at ~100 — and a figure nobody
# re-measures is how a silently dropped test file goes unnoticed in the one file whose stated
# premise is that it gates on what is real (fifth review pass, 2026-09-22).
#
# Every gate here has been watched to fail, because a gate nobody has seen fail is
# indistinguishable from a green light:
#   * typecheck — injecting `const x: number = "str"` into packages/domain/src/units.ts
#     fails with TS2322 (verified in slice A).
#   * lint — eleven injected violations each fail with the rule named, and each returns the
#     gate to 0 when removed: `Date.now()`, `new Date()`, `Date()`, `process.env.FOO`,
#     `const { env } = process` and `const p = process; p.env.FOO` in a source file; the
#     first two forms inside each sanctioned home, which is exempt from one ban and not the
#     other; `Date.now()` in a test file; a `.mjs` module under packages/; and a stale
#     eslint-disable directive, which `--max-warnings 0` turns into a failure. The full
#     table is in spec-1-1-workspace-skeleton.md.
#   * typecheck (apps/worker) — `const __bad: number = 'nope'` in apps/worker/src/index.ts
#     is caught by this step and by neither of the other two, because the root tsconfig
#     excludes `apps`.
#   * tests (the role split) — each assertion was watched to fail by breaking the thing it
#     covers: pointing the entry point at DATABASE_URL, flipping `migrate` to true, granting
#     the app role CREATE on `pgboss`, granting it BYPASSRLS, deleting the migrator's
#     percent-decoding, relaxing APP_DATABASE_URL to a zod `.default()` (which still
#     typechecks), and removing APP_DATABASE_URL under REQUIRE_DB=1. The full table is in
#     spec-1-1-pgboss-roles.md.
#   * tests (isolation) — each assertion was watched to fail by sabotaging the thing it
#     covers: dropping FORCE on one table, dropping its policy, creating a table outside the
#     registry, reading without `withTenant`, reading tenant A's rows inside `withTenant(B)`,
#     granting the app role UPDATE on an append-only table, and dropping the append-only
#     trigger. The full table is in spec-1-2-rls-and-withtenant.md.
#   * tests (the cross-tenant harness) — nineteen distinct sabotages, each watched to fail
#     and then restored: an exported read with no registry entry (caught with NO database),
#     every registry entry marked `not-a-read` (which would empty the probe matrix), two
#     probe Tenants given overlapping tokens or overlapping `seq` bands, the
#     `set_config` call deleted from `withTenant`, the `WHERE` dropped from the read of the
#     `global` `tenant` table, `USING (true)` on each of six tenant-owned policies
#     (`baseline_wp`, `rate_entry`, `actuals_ledger_entry`, `tracker_snapshot`,
#     `work_package`, `mapping_event`), a use case reading on the bare handle outside the
#     tenant scope, three separate entries broken in the relabeller's preserved vocabulary,
#     a table dropped from the declared unreached set, a writer that stamps the wrong active
#     Baseline sequence on a second Tenant's ledger, and two probe Tenants sharing an id
#     prefix or a `seq` band. The full tables are in spec-1-2-cross-tenant-harness.md.
#   * tests (the use-case move, story 1.2 slice 3) — an exported use case with no registry
#     entry (caught with NO database), a use case letting the repository's not-found throw,
#     one swallowing it into a default (caught by the not_found probe, and — with the
#     repository failing for the caller's own Tenant — by the completeness floor), and one
#     ignoring the context's Tenant (15 failures). A drifted port is caught by the typecheck
#     at the composition root, TS2322. The full table is in spec-1-2-web-read-use-cases.md.
#   * dependency-cruiser (story 1.2 slice 4) — `@momo/db` imported from a page (by value and
#     type-only), `drizzle-orm` from actions.ts, `packages/db` reached by a relative path from
#     a component, and a temporary file at each forward-looking scheduling path
#     (domain/schedule importing attribution; db/repositories/schedule imported outside
#     app/schedule; db/repositories/plan-input imported by the composition root) each fail
#     `pnpm depcruise` naming the file and the rule.
#   * tests (the writes, story 1.2 slice 4) — a write use case exported with no registry entry
#     (caught with NO database), a write ignoring the context's Tenant, the not_found mapping
#     removed from the write path, and the write port miswired or drifted at the composition
#     root (TS2322). The full table is in spec-1-2-web-write-use-cases.md.
#   * tests (the audit mechanism, story 1.3 slice 1) — `tests/audited-use-cases.test.ts` runs in
#     this suite with NO database: it enumerates the use-case surface and drives every audited
#     write against a fake tenant transaction; the write harness proves the rollback against
#     Postgres. Watched to fail — by the no-database gate: a write skipping `audit.record`,
#     `audit.record` on a second transaction opened by the use case, the change swallowed after
#     the audit call, and a new write exported unclassified; by the typecheck (TS2345) and the
#     unit tests: an action outside the enum, refused at run time when forced; ONLY by the
#     Postgres rollback tests in tests/cross-tenant-writes.test.ts: the db sink appending on its
#     own `withTenant` (the no-database gate passes it). The full table is in
#     spec-1-3-audit-mechanism.md.
#   * tests + dependency-cruiser (the organisation hierarchy, story 1.3 slice 2) — the gate and the
#     write harness are no longer project-shaped: both drive every write through the whole
#     `WriteScope` and `WriteDeps`, and the eight org writes are on the surface. Watched to fail:
#     an org write skipping `audit.record` (the no-database gate, the DB rollback and row tests,
#     the composition and unit tests); the Program/Department rule removed
#     (tests/org-writes.test.ts and the unit tests); org writes ignoring `ctx.tenantId` (24
#     failures across the harness, the org suite and the unit tests); a Program move also
#     updating another table (tests/org-writes.test.ts, naming the table); a file under apps/web
#     importing `@momo/adapters`, by alias or relative path (`pnpm depcruise`,
#     `apps-adapters-only-from-composition-root`). The full table is in
#     spec-1-3-organisation-hierarchy.md.
#   * tests + dependency-cruiser (identity and the request context, story 1.4 slice 1) — sign-in,
#     the membership bridge and `resolveRequestContext` (tests/identity.test.ts against Postgres;
#     the resolver, the middleware gate and the auth options without one). Six sabotages, each
#     watched to fail and then restored: `session.cookieCache` enabled (packages/db/auth
#     auth.test.ts + four identity.test.ts rows); `tenantMembership` imported by a module in
#     packages/app (source-discipline.test.ts); `better-auth` or `@momo/db-auth` imported from
#     apps/web/src/components (`pnpm depcruise`, `better-auth-only-in-db-auth`,
#     `web-db-auth-only-from-composition-root`) — and, after the depcruise `exclude` was narrowed so
#     edges into node_modules `dist/` are no longer dropped, the better-auth rule watched to fire on
#     resolved edges; a tenant id literal in apps/web (tests/web-composition.test.ts text scan);
#     the resolver's membership match skipped (4 failures across the resolver unit test, the
#     composition test and identity.test.ts); `tenantBridge` set on `department` (registry.test.ts,
#     plus rls.sql drift when its tenantColumn is nulled too). The full table is in
#     spec-1-4-identity-and-request-context.md.
#   * tests (revocation and the membership writes, story 1.4 slice 2) — the four membership writes
#     on the restricted role, their audit rows and the three concurrency rows
#     (tests/membership.test.ts against Postgres, plus the unit tests and the audited-use-case
#     gate). Five sabotages, each watched to fail and then restored: `tenant_id` dropped from
#     `lockMembers` (8 failures — the foreign replay of three membership writes in
#     cross-tenant-writes, and five membership.test rows); `tenant_id` dropped from the
#     delete/update WHERE (membership.test, the user who is a member of BOTH probe Tenants — the
#     only row that discriminates it, which is why that user exists); the single lock split in two
#     (the self-demotion race; split per row instead, all three concurrency rows); `audit.record`
#     removed from `unassignMemberProject` (8 failures across the gate, the unit test, both
#     rollback tests, membership.test and web-composition); `membershipWriterOn` re-exported from
#     `repo-org.ts` (source-discipline.test.ts). The full table is in
#     spec-1-4-revocation-and-membership.md.
#   * tests + dependency-cruiser (Google sign-in, story 1.4 slice 3) — the whole refusal matrix
#     against a fake OIDC provider the test drives knob by knob (tests/google-sign-in.test.ts;
#     tests/web-google-discovery.test.ts for the discovery and middleware paths). Eight sabotages,
#     each watched to fail and then restored: `disableSignUp` removed; the `getUserInfo` override
#     removed; `requireIdTokenVerification: false`; the token-nulling hook removed; `onAPIError`
#     removed (forged state and five other refusals land on /api/auth/error instead of the one
#     generic page); `/sign-in/social` moved out of DISABLED_PATHS and into the allowlist
#     (auth.test.ts, google-sign-in.test.ts, identity.test.ts x2); `refreshSession` called on the
#     Google instance (web-composition.test.ts and web-google-discovery.test.ts catch the
#     discovery fetch from the middleware path); and `apps/` or `packages/` importing
#     `tests/support/`, from either tree (`pnpm depcruise`). The full table is in
#     spec-1-4-google-sign-in.md.
#   * tests (password reset through MailerPort, story 1.4 slice 4) — the reset request, the token
#     redemption, and everything a completed reset must do, against Postgres
#     (tests/password-reset.test.ts). Watched to fail and then restored:
#     `revokeSessionsOnPasswordReset` removed (auth.test.ts's options pin, and a session surviving
#     the reset); the boundary's lowercasing removed from forgot-password/actions.ts (its
#     co-located action test); `identity_event` granted UPDATE (registry.test.ts's override set
#     AND the grants.sql drift check); the mailer throwing (the request still answers true and the
#     warning names no address). TWO ENTRIES THAT ARE NOT PASS->FAIL, recorded as such rather than
#     as gates: `resetPasswordTokenExpiresIn` removed is caught only by the options pin, because
#     Better Auth's own default happens to equal 3600 too; and `/reset-password` added to
#     SERVED_AUTH_ENDPOINTS ALONE still answers 404, since DISABLED_PATHS blocks it independently
#     at Better Auth's router — only changing both is a real sabotage, and nothing in the suite
#     demonstrates the compound one. The full table is in spec-1-4-password-reset.md.
#   * tests (the fences themselves, fifth review pass over story 1.4) —
#     tests/depcruise-fences.test.ts drives the depcruise CLI over the real tree, because
#     `pnpm depcruise` reports violations of the rules it can SEE and says nothing at all about a
#     rule that has stopped APPLYING. Both failures it pins were measured green under the cruiser.
#     Watched to fail and then restored: the `exclude` regex broadened back to
#     `(^|/)([.]next|dist)/`, which swallows node_modules' own `dist/` so the graph holds ZERO
#     better-auth edges and `better-auth-only-in-db-auth` can never fire; and
#     `no-test-or-tooling-in-source` narrowed back to `to: ^tests/support/`, which leaves the hop
#     `packages/ -> scripts/ -> tests/support/fake-oidc` cruising clean, because `scripts/` is
#     outside the cruise ENTRY POINTS but not outside the GRAPH. That rule was renamed from
#     `no-test-support-in-source` when its `to` widened to `^(tests|scripts)/`; it now also carves
#     out in-package `*.test.ts`, which is not application source. The findings are in
#     spec-1-4-password-reset.md.

# THESE GATES REPORT; THEY DO NOT BLOCK. The repository is private on a free plan, so
# GitHub refuses branch protection ("Upgrade to GitHub Pro or make this repository
# public"). Founder decision, 2026-09-20: stay private and keep the discipline in the
# person rather than the platform — the alternatives were paying for Pro, or going
# public with planning artifacts that carry a real client's name and contract type.
# Revisit when a second person can merge.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + 3 typechecks + depcruise + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The image is pinned to the same tag infra/docker-compose.yml uses, so CI and a
    # laptop exercise the same server. The round-trip test is the only gate covering
    # the ORM, the driver and the server together; everything else here is static.
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: momo
          POSTGRES_PASSWORD: momo
          POSTGRES_DB: momo_keikaku
        ports:
          - 55433:5432
        options: >-
          --health-cmd "pg_isready -U momo -d momo_keikaku"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgres://momo:momo@localhost:55433/momo_keikaku
      # The restricted `app` role, created by the prepare step below from this very string:
      # `pnpm pgboss:migrate` reads the role name and password out of it, so the role the
      # worker connects as and the role the migrator creates cannot disagree, and
      # `pnpm db:policies` grants to the same name for the same reason. It is NOT a second
      # name for DATABASE_URL: it is a non-owner without BYPASSRLS, holding DML on the
      # `pgboss` schema plus exactly the per-table privileges the table-class registry
      # states — no UPDATE or DELETE on any append-only table, and no TRUNCATE anywhere.
      # From story 1.2 on it is also the role `apps/web` and the round-trip test connect as.
      APP_DATABASE_URL: postgres://momo_app:momo_app@localhost:55433/momo_keikaku
      # Turns an unreachable database into a failure instead of a skip. Without it the
      # round-trip tests and the isolation gates would pass by not running, which is the
      # same as not having them.
      REQUIRE_DB: '1'
      # Story 1.4 slice 1 (sign-in). CI-only values, not secrets: the seed hashes SEED_DEMO_PASSWORD
      # for the demo users `linh` and `hoang`; the Better Auth pair is read only by the web process
      # (and the tests that build an instance take their own).
      SEED_DEMO_PASSWORD: ci-demo-password-2026
      BETTER_AUTH_SECRET: ci-only-better-auth-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3101

    steps:
      - uses: actions/checkout@v4

      # ARCHITECTURE-SPINE.md pins Node.js 24.21.0 (LTS "Krypton"), and this is the exact
      # version, not a floating major: two runs of the same commit resolve the same Node.
      # Reads `.nvmrc`, so CI and a laptop running `nvm use` can never name different
      # Node versions. The value there is the architecture's decided 24.21.0.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      # corepack reads `packageManager` from package.json, so the pnpm version is never
      # duplicated here. It is 12.4.2, the version the spine decided. Bumping it needs no
      # edit to this file, but it is NOT a one-file change: pnpm pins itself in the
      # lockfile (`packageManagerDependencies` plus 42 `@pnpm/exe.*` entries), so
      # `packageManager` and `pnpm-lock.yaml` must move together or the frozen install
      # below fails before any gate runs.
      - name: Enable corepack (honours packageManager)
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      # Three typecheck steps, because the root tsconfig excludes `apps` — so each app
      # needs its own or a type error there reaches main unnoticed. Next.js only catches
      # apps/web's at `next build`, which CI does not run, and nothing at all would catch
      # apps/worker's. All three are plain `tsc --noEmit`, so none emits into the source
      # tree.
      - name: Typecheck (packages, scripts)
        run: pnpm typecheck

      - name: Typecheck (apps/web)
        if: always()
        run: pnpm --filter @momo/web typecheck

      - name: Typecheck (apps/worker)
        if: always()
        run: pnpm --filter @momo/worker typecheck

      # The clock and environment fence (see eslint.config.js). It is ESLint rather than
      # dependency-cruiser because dependency-cruiser sees imports and this class of
      # violation is a call, not an import. An ungated rule enforces nothing, which is
      # why this step exists the same day the rules do.
      - name: Lint (clock/env fence)
        if: always()
        run: pnpm lint

      # The import-direction gate (AD-1, story 1.2 AC-6). No database: it reads the import
      # graph only. It is the gate that fails when a page or an action imports `@momo/db` or
      # `drizzle-orm` again — which lint and all three typechecks let through (measured in
      # story 1.2 slice 3). The rules and their scope are in .dependency-cruiser.cjs.
      - name: Dependency-cruiser (import direction)
        if: always()
        run: pnpm depcruise

      # AD-24 / AR-41 (story 5.1): committed Backlog fixtures stay on the FR-19 whitelist.
      - name: Fixture whitelist (FR-19)
        if: always()
        run: pnpm fixtures:check-whitelist

      # The round-trip tests need something to read. `db:migrate` applies the migrations in
      # packages/db/drizzle through `drizzle-kit migrate` (AD-19) — story 2.1's AD-30 migration
      # (0000) and the watermark slice's identity `seq` (0001). 0000's hand-written MATCH FULL /
      # DEFERRABLE clauses a `push` from schema.ts would silently lose. `schema-catalog.test.ts` asserts them against the catalogue.
      #
      # `pgboss:migrate` is the owner-role step: it creates the `migrator` and `app` roles,
      # installs pg-boss's schema from the SQL pg-boss itself generates, and grants the app
      # role USAGE plus DML and nothing else. It runs here rather than inside the worker
      # because the worker's whole point is that it *cannot* do this.
      #
      # `db:policies` is story 1.2's step and is the reason this order matters. It applies
      # the row-level security, the grants and the append-only triggers GENERATED from
      # packages/db/src/table-classes.ts, so it must run after `db:migrate` (the
      # tables have to exist) and after `pgboss:migrate` (the application role it grants to
      # has to exist). The seed runs last, because it is the first thing that exercises the
      # policies it now writes under.
      #
      # Both steps run TWICE on purpose. Idempotence is an acceptance criterion — of story
      # 1.1 slice B2 for the migrator and of this slice for the policies — and a criterion
      # checked by hand once is not a gate: the second run is what fails the build the day a
      # non-idempotent statement is added to either script.
      - name: Prepare database (schema + roles + RLS/grants/triggers + seed)
        if: always()
        run: |
          pnpm db:migrate
          pnpm pgboss:migrate
          pnpm pgboss:migrate
          pnpm db:policies
          pnpm db:policies
          pnpm seed

      # The drift gate (story 2.1). CI applies the committed SQL in packages/db/drizzle, while the
      # code is typed from schema.ts, so the two can diverge with every other step green. A
      # regeneration from schema.ts must produce nothing new.
      - name: Migration drift (schema.ts vs packages/db/drizzle)
        if: always()
        run: |
          pnpm exec drizzle-kit generate
          drift="$(git status --porcelain packages/db/drizzle)"
          if [ "$drift" != "" ]; then
            echo "$drift"
            echo "::error::packages/db/drizzle is out of step with packages/db/src/schema.ts. Generate the next migration with drizzle-kit generate, re-apply any hand edits its header lists, and commit it."
            exit 1
          fi

      # THE GATE THAT TYPECHECKING IS NOT. `tsc` reads neither `next.config.ts` nor
      # `apps/web/package.json`, so `transpilePackages`, the app's own dependencies and the
      # Node-runtime middleware were all unverified — drop `@momo/db-auth` from any of them and
      # every other step here stays green while the app does not start. Added after a review pass
      # ran this by hand and found `next build` failing on `/_not-found`: the root layout reached
      # the composition root's configuration getters before Next could bail the page out to
      # dynamic, which made the composition root's "importing it reads no configuration" promise
      # false. This step inherits the job's `env`, so it does NOT check that promise — a build
      # needing configuration would still pass here. What it does check is the wiring: that the
      # app resolves, transpiles and server-bundles its workspace packages at all.
      - name: Build (apps/web)
        if: always()
        run: pnpm --filter @momo/web build

      # `always()` throughout so one failure does not hide the others. Every signal
      # lands on the same run.
      - name: Tests
        if: always()
        run: pnpm test

      # The wall-clock NFR suites (`*-nfr*.test.ts`), excluded from `pnpm test` and run one file
      # at a time: under the parallel run they timed the other 150 files, not the code.
      - name: Tests (NFR budgets)
        if: always()
        run: pnpm test:nfr
