# Minimal CI: the two gates that can run green today.
#
# THIS IS NOT THE FULL GATE SET. ARCHITECTURE-SPINE.md AD-19 requires CI to block
# merge on: dependency-cruiser, the ESLint clock/env rules, the cross-tenant harness
# (AD-3), the append-only DB test (AD-5), the FORCE-RLS assertion (AD-3), the golden
# Published Snapshot recompute per formulaVersion (AD-10), the compaction-then-recompute
# test (AD-5), the ComputationInputs closure test (AD-10), the concurrency test (AD-20),
# and the six scheduler gates (AD-26/27/28).
#
# Every one of those needs code that does not exist yet, and most need a Postgres
# service. They belong to Epic 1 story 1.1 (the workspace, the import fences and the
# gate list) and Epic 2 story 2.1 (the migration). Adding them here before their code
# exists would make CI red on day one for a reason nobody could fix that day — which is
# the failure epics.md warns about for the dependency-cruiser gate specifically.
#
# So this file gates on what is real: typecheck and the test suite. Measured on
# 2026-09-20 — `pnpm typecheck` exits 0, and `pnpm test` passes 46 tests across 3 files
# with DATABASE_URL pointing at a dead port, so no database service is needed yet.
# Add a `services: postgres` block when the first test needs one.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repo.
permissions:
  contents: read

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # ARCHITECTURE-SPINE.md pins Node.js 24.21.0 (LTS "Krypton"); the major is pinned
      # here and patches float, because the spine also notes the upgrade window for v1
      # is after R1. Story 1.1 owns tightening this to the exact version.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # corepack reads `packageManager` from package.json, so the pnpm version is never
      # duplicated here. It is 9.15.0 today; the spine decided 12.4.2 and story 1.1's
      # version-trap work will bump it. CI follows that change with no edit to this file.
      - name: Enable corepack (honours packageManager)
        run: corepack enable

      - name: Resolve pnpm store path
        run: echo "PNPM_STORE=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - uses: actions/cache@v4
        with:
          path: ${{ env.PNPM_STORE }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # `always()` so a typecheck failure does not hide the test result. Both signals
      # land on the same run.
      - name: Tests
        if: always()
        run: pnpm test
