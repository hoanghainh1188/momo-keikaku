services:
  postgres:
    image: postgres:18.6-alpine
    container_name: momo-keikaku-postgres
    environment:
      POSTGRES_USER: momo
      POSTGRES_PASSWORD: momo
      POSTGRES_DB: momo_keikaku
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U momo -d momo_keikaku"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - momo-pgdata:/var/lib/postgresql
volumes:
  momo-pgdata:
